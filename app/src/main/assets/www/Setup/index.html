<!DOCTYPE html> 
<html>
 <head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"> 
  <link href="../src/Fonts/fonts.css" rel="stylesheet" type="text/css"/> 
  <link href="index.css" rel="stylesheet" type="text/css"/> 
  <script src="index.js" type="text/javascript"></script> 
  <title>Phoenix</title>  
 </head>
 <body> 
  <Main> 
   <form id="ThemeColors">
    <Application> 
     <Splash> 
    
     </Splash>
     <p>Phoenix</p>
    </Application>
    <Group>
     <p>Theme</p>
     <Container>
      <label for="TS"> 
       <img src="../src/design/theme%20system.png" alt=""/>
       <p>System</p>
       <input type="checkbox" name="" id="TS" checked/>
      </label>
      <label for="TW">
       <img src="../src/design/theme%20white.png" alt=""/>
       <p>White</p>
       <input type="checkbox" name="" id="TW"/>
      </label>
      <label for="TB">
       <img src="../src/design/theme%20black.png" alt=""/>
       <p>Black</p>
       <input type="checkbox" name="" id="TB" />
      </label>
     </Container>
    </Group>
    <Group>
     <p>Color</p> 
     <Container>
      <label for="#ff0000"> 
        <Color style="background-color: #ff0000"></Color>
        <input type="checkbox" name="" id="#ff0000" checked/>
      </label> 
      <label for="#00ff00"> 
        <Color style="background-color: #00ff00"></Color>
        <input type="checkbox" name="" id="#00ff00" />
      </label> 
      <label for="#0000ff"> 
        <Color style="background-color: #0000ff"></Color>
        <input type="checkbox" name="" id="#0000ff" />
      </label> 
      <label for="#ffff00"> 
        <Color style="background-color: #ffff00"></Color>
        <input type="checkbox" name="" id="#ffff00" />
      </label> 
      <label for="#ff00ff"> 
        <Color style="background-color: #ff00ff"></Color>
        <input type="checkbox" name="" id="#ff00ff" />
      </label> 
      <label for="#00ffff"> 
        <Color style="background-color: #00ffff"></Color>
        <input type="checkbox" name="" id="#00ffff" />
      </label> 
      <label for="#ff8800"> 
        <Color style="background-color: #ff8800"></Color>
        <input type="checkbox" name="" id="#ff8800" />
      </label> 
      <label for="#8800ff"> 
        <Color style="background-color: #8800ff"></Color>
        <input type="checkbox" name="" id="#8800ff" />
      </label> 
      <label for="#ffffff"> 
        <Color style="background-color: #ffffff"></Color>
        <input type="checkbox" name="" id="#ffffff" />
      </label>
     </Container>
    </Group>
    <Actions>
     <button>Next</button> 
    </Actions>
   </form>
  </Main>
 </body>
</html>
