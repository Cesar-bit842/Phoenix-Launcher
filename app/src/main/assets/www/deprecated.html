<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Phoenix - Hytale Launcher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #1c1715 0%, #0f0e0e 100%);
            color: #ece6e4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: #1c1715;
            border: 1px solid #ff6b00;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(255, 107, 0, 0.2);
            text-align: center;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 12px;
        }
        h1 {
            color: #ff9e00;
            font-size: 22px;
            margin-bottom: 8px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        p.subtitle {
            color: #d0c4c0;
            font-size: 13px;
            margin-bottom: 24px;
        }
        .card {
            background: #261c18;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: left;
            border-left: 4px solid #ff6b00;
        }
        .card h3 {
            color: #ff9e00;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .card p {
            color: #d0c4c0;
            font-size: 12px;
        }
        button {
            background: linear-gradient(135deg, #ff6b00 0%, #ff9e00 100%);
            color: #0f0e0e;
            border: none;
            padding: 14px 24px;
            font-weight: bold;
            font-size: 15px;
            border-radius: 28px;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            box-shadow: 0 4px 14px rgba(255, 107, 0, 0.4);
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.98);
        }
        .status-box {
            margin-top: 16px;
            padding: 12px;
            background: #110d0c;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            color: #ff9e00;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔥</div>
        <h1>PROYECTO PHOENIX</h1>
        <p class="subtitle">Hytale Mobile Launcher (WebView / Assets)</p>

        <div class="card">
            <h3>📂 Carpeta Web Local</h3>
            <p>Este sitio web se carga directamente desde <b>assets/www/</b> en el proyecto Android.</p>
        </div>

        <div class="card">
            <h3>⚡ Puente Electron-like (JS ⇄ Java)</h3>
            <p>Comunícate con métodos nativos ejecutados en Java mediante <code>AndroidBridge</code>.</p>
        </div>

        <button onclick="checkStatus()">Comprobar Estado Box64</button>
        <button onclick="installRuntime()" style="background: linear-gradient(135deg, #d32f2f 0%, #ff5722 100%); color: white;">Instalar Runtime Box64</button>

        <div id="status" class="status-box">Esperando acción...</div>
    </div>

    <script>
        function checkStatus() {
            try {
                let installed = AndroidBridge.checkBox64Installed();
                document.getElementById('status').innerText = "Box64 instalado: " + installed;
                AndroidBridge.showToast("Estado consultado: " + installed);
            } catch (e) {
                document.getElementById('status').innerText = "Error: " + e.message;
            }
        }

        function installRuntime() {
            try {
                document.getElementById('status').innerText = "Iniciando instalación de Box64...";
                AndroidBridge.installBox64();
            } catch (e) {
                document.getElementById('status').innerText = "Error: " + e.message;
            }
        }
    </script>
</body>
</html>
